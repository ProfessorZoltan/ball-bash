# Builds the desktop version (desktop/) for Windows and macOS and attaches
# both to a GitHub Release whenever a version tag is pushed:
#
#   git tag v0.3.0-alpha
#   git push origin v0.3.0-alpha
#
# The tag sets the app version; a tag with a "-" in it (alpha, beta, rc) is
# published as a pre-release. "Run workflow" on the Actions tab builds the
# installers without publishing (download them from the run's artifacts).
#
# The macOS .dmg is unsigned and not notarized (no Apple Developer cert), so
# Gatekeeper will warn on first launch; users need to right-click > Open.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build-flag: --win
            artifact-glob: desktop/dist/*.exe
            release-files: |
              desktop/dist/*.exe
              desktop/dist/*.blockmap
          - os: macos-latest
            platform: mac
            build-flag: --mac
            artifact-glob: desktop/dist/*.dmg
            release-files: |
              desktop/dist/*.dmg
              desktop/dist/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Test the game
        run: npm test

      - name: Version from the tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="$(node -p "require('./desktop/package.json').version")-build${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          game=$(node -p "require('fs').readFileSync('src/config.js','utf8').match(/GAME_VERSION = '([^']+)'/)[1]")
          if [[ "$v" != "$game" ]]; then
            echo "::warning::Building $v but src/config.js says GAME_VERSION = '$game'"
          fi
          cd desktop && npm version --no-git-tag-version --allow-same-version "$v"

      - name: Install
        run: npm ci
        working-directory: desktop

      - name: Build installer
        run: npx electron-builder ${{ matrix.build-flag }} --publish never
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: Deflector-${{ matrix.platform }}-${{ steps.ver.outputs.version }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Deflector ${{ steps.ver.outputs.version }}
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          files: ${{ matrix.release-files }}
